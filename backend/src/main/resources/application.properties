# --- Développement : base H2 dans un fichier local (./data) ---
spring.datasource.url=jdbc:h2:file:./data/veilleuses
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sites autorisés à appeler l'API (séparés par des virgules)
veilleuses.cors.origines=${CORS_ORIGINES:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}

# Anti-abus : nombre de points max par connexion et par fenêtre de temps
veilleuses.limite.max=3
veilleuses.limite.fenetre-minutes=60

server.port=${PORT:8080}
